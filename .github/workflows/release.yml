name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            name: linux-x86_64
            pm: apt
            deps: g++ libreadline-dev libcurl4-openssl-dev
          - os: ubuntu-24.04-arm
            name: linux-aarch64
            pm: apt
            deps: g++ libreadline-dev libcurl4-openssl-dev
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        shell: bash
        run: |
          set -e
          if [ "${{ matrix.pm }}" = "apt" ]; then
            sudo apt-get update
            sudo apt-get install -y ${{ matrix.deps }}
          else
            brew install ${{ matrix.deps }}
          fi

      - name: Fetch nlohmann/json
        run: |
          mkdir -p "$HOME/.local/include/nlohmann"
          curl -fsSL "https://github.com/nlohmann/json/releases/download/v3.11.3/json.hpp" \
               -o "$HOME/.local/include/nlohmann/json.hpp"

      - name: Build
        shell: bash
        run: |
          set -e
          EXTRA_I=""; EXTRA_L=""
          if [ "$RUNNER_OS" = "macOS" ]; then
            RL="$(brew --prefix readline)"
            CU="$(brew --prefix curl)"
            EXTRA_I="-I$RL/include -I$CU/include"
            EXTRA_L="-L$RL/lib -L$CU/lib"
          fi
          mkdir -p dist
          g++ -std=c++17 -O2 -I"$HOME/.local/include" $EXTRA_I \
              -o "dist/sw_chat-${{ matrix.name }}" sw_chat.cpp \
              $EXTRA_L -lreadline -lcurl -lpthread
          strip "dist/sw_chat-${{ matrix.name }}" || true
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: sw_chat-${{ matrix.name }}
          path: dist/sw_chat-${{ matrix.name }}
          if-no-files-found: error

  macos:
    # macOS-раннеры GitHub периодически не выделяются (runner_id=0, джоба отменяется
    # за секунду без единого шага). Это внешняя причина, не наш код, поэтому джоба
    # необязательная: релиз выходит с linux-бинарями, macOS добавляется когда раннер дают.
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: brew install readline curl

      - name: Fetch nlohmann/json
        run: |
          mkdir -p "$HOME/.local/include/nlohmann"
          curl -fsSL "https://github.com/nlohmann/json/releases/download/v3.11.3/json.hpp" \
               -o "$HOME/.local/include/nlohmann/json.hpp"

      - name: Build
        run: |
          set -e
          RL="$(brew --prefix readline)"
          CU="$(brew --prefix curl)"
          mkdir -p dist
          g++ -std=c++17 -O2 -I"$HOME/.local/include" -I"$RL/include" -I"$CU/include" \
              -o dist/sw_chat-macos-arm64 sw_chat.cpp \
              -L"$RL/lib" -L"$CU/lib" -lreadline -lcurl -lpthread
          strip dist/sw_chat-macos-arm64 || true
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: sw_chat-macos-arm64
          path: dist/sw_chat-macos-arm64
          if-no-files-found: warn

  termux:
    # Termux-бинарь в нативном arm64-контейнере Termux. Джоба необязательная для релиза
    # (continue-on-error), но внутри себя честная: set -e, проверка файла, лог в артефакт
    # и ключевые строки в аннотацию (логи джоб без admin-прав не читаются).
    runs-on: ubuntu-24.04-arm
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Build inside Termux (aarch64)
        run: |
          mkdir -p dist
          chmod 777 dist
          LOG=termux-build.log
          : > "$LOG"
          docker pull termux/termux-docker:aarch64 2>&1 | tee -a "$LOG" || {
            echo "::error::Образ termux-docker:aarch64 не скачался"; exit 1; }

          set +e
          docker run --rm -i -v "$PWD:/src" -w /src termux/termux-docker:aarch64 bash -lc '
            set -e
            echo "=== df -h ==="
            df -h / /data 2>/dev/null || df -h
            echo "=== pkg update ==="
            yes | pkg update -y
            echo "=== pkg install ==="
            pkg install -y clang make readline libcurl curl
            echo "=== tool check ==="
            command -v clang++ || { echo "clang++ НЕТ"; exit 1; }
            command -v curl || { echo "curl НЕТ"; exit 1; }
            echo "=== json.hpp ==="
            mkdir -p "$HOME/.local/include/nlohmann"
            curl -fsSL "https://github.com/nlohmann/json/releases/download/v3.11.3/json.hpp" -o "$HOME/.local/include/nlohmann/json.hpp"
            echo "=== compile ==="
            clang++ -std=c++17 -O2 -I"$HOME/.local/include" -o "$HOME/sw_chat-termux-aarch64" sw_chat.cpp -lreadline -lcurl -lpthread
            echo "=== built, copy out ==="
            ls -la "$HOME/sw_chat-termux-aarch64"
            cp "$HOME/sw_chat-termux-aarch64" /src/dist/sw_chat-termux-aarch64
            ls -la /src/dist/sw_chat-termux-aarch64
          ' 2>&1 | tee -a "$LOG"
          RC=${PIPESTATUS[0]}
          set -e
          echo "termux exit code: $RC" | tee -a "$LOG"
          if [ "$RC" -ne 0 ] || [ ! -s dist/sw_chat-termux-aarch64 ]; then
            echo "::error::Сборка под Termux не удалась: rc=$RC, файл $([ -s dist/sw_chat-termux-aarch64 ] && echo есть || echo НЕТ)"
            exit 1
          fi
          ls -la dist

      - name: Show key log lines (аннотация вместо недоступных логов)
        if: failure()
        run: |
          if [ -f termux-build.log ]; then
            MSG=$(grep -n -E 'error|Error|ERROR|E:|No space|failed|not found|conflict|Unable' termux-build.log | tail -25 | sed ':a;N;$!ba;s/\n/%0A/g')
            [ -z "$MSG" ] && MSG=$(tail -c 1200 termux-build.log | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=Termux key lines::$MSG"
          fi

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: termux-build-log
          path: termux-build.log
          if-no-files-found: warn

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: sw_chat-termux-aarch64
          path: dist/sw_chat-termux-aarch64
          if-no-files-found: error

  release:
    needs: [build, macos, termux]
    # continue-on-error не спасает от статуса cancelled (macOS-раннер отменяют за секунду).
    # Поэтому условие явное: релиз выходит, если ОБЯЗАТЕЛЬНЫЕ linux-сборки прошли,
    # а необязательные (macos, termux) могут быть в любом состоянии.
    if: always() && startsWith(github.ref, 'refs/tags/v') && needs.build.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
          # Termux-артефакта может не быть — это не повод валить релиз.

      - name: Checksums
        run: |
          cd artifacts
          ls -la
          sha256sum sw_chat-* > SHA256SUMS
          cat SHA256SUMS

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/sw_chat-*
            artifacts/SHA256SUMS
          generate_release_notes: true
